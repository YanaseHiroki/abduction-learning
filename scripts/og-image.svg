<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The share card (og:image). Edit here, then `pnpm og-image` writes public/og-image.png. -->
  <!-- the header colour (--header in src/index.css) -->
  <rect width="1200" height="630" fill="#3a3a3a"/>
  <!-- lucide Sprout, the header logo; same paths, colour and stroke as public/favicon.svg -->
  <g transform="translate(528 70) scale(6)" fill="none" stroke="#a3e635" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/>
    <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/>
    <path d="M5 21h14"/>
  </g>
  <g text-anchor="middle" font-family="Geist Variable, Hiragino Sans, Noto Sans JP, sans-serif">
    <text x="600" y="330" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Abduction Learning</text>
    <text x="600" y="435" font-size="54" font-weight="700" fill="#e5e5e5">例文から自分で仮説を立てて、確かめる。</text>
    <text x="600" y="512" font-size="36" font-weight="500" fill="#c4c4c4">Form your own hypotheses from examples, then test them.</text>
