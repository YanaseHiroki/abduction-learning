<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Pick the theme before first paint (the same rule as applyTheme in src/lib/settings.ts).
      try {
        var theme = JSON.parse(localStorage.getItem("abduction-learning.settings") || "{}").theme || "system";
        if (theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>Abduction Learning — アブダクション語学学習</title>
    <meta
      name="description"
      content="AIには例文だけを出させ、似た意味の語の違いを自分で見つける語学練習帳。観察 → 仮説 → 検証を繰り返します。／ A notebook for finding how similar words differ: the AI gives examples only, you form and test the hypotheses."
    />
    <meta name="theme-color" content="#1c1917" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abduction Learning — アブダクション語学学習" />
    <meta property="og:description" content="例文から自分で仮説を立てて、確かめる。／ Form your own hypotheses from examples, then test them." />
    <meta property="og:site_name" content="Abduction Learning" />
    <!-- og:url and og:image (absolute URLs) go here at build time; see vite.config.ts -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="芽のロゴと「Abduction Learning」、「例文から自分で仮説を立てて、確かめる。」" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
