# Cloudflare Worker that holds the shared (owner-paid) API key and enforces daily limits.
# Deploy: `pnpm --filter abduction-learning-proxy deploy` (or the GitHub Action in .github/workflows/deploy.yml).
name = "abduction-learning-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Which provider the shared key belongs to: anthropic | openai | gemini
PROVIDER = "openai"
# Cheap model for the free tier. Chosen from the 2026-09 benchmark (docs/model-bench-2026-09.md):
# gpt-5.6-luna was the cheapest run that passed every check (≈ $0.0026 per example set, $0.0003 per
# translation test, 0 grammar errors). Runner-up: gemini-3.1-flash-lite (faster, 4× the translation cost).
# Re-run the app's unlinked #/bench page before changing this.
MODEL = "gpt-5.6-luna"
# Comma-separated origins allowed to call this proxy (the GitHub Pages site). Empty = allow any.
ALLOWED_ORIGINS = "https://yanasehiroki.github.io"
# The free tier is counted in inquiries. These are how many inquiries may be started per day.
# A device may start 5 on its first day (to try the method a few times), then 3 per day —
# enough to keep going with a second word pair, or to retry after a run that went nowhere.
LIMIT_DEVICE = "3"
LIMIT_DEVICE_FIRST_DAY = "5"
# Per IP: slows down clearing the anonymous device ID to get another first day. Must be >= the first-day limit.
LIMIT_IP = "10"
# Everyone together, counted in inquiries. A backstop only: the money is capped by DAILY_BUDGET_USD below.
# 330 ≈ $3 at the 2026-09 average of $0.009 per inquiry (docs/model-bench-2026-09.md), so on an ordinary
# day ADMIT_BUDGET_USD stops admissions first. LIMIT_IP still applies, so 330 takes at least 33 distinct IPs.
# The support page states DAILY_BUDGET_USD (via /quota) and explains it with COST_PER_INQUIRY_USD in
# src/lib/support.ts: change that together with the per-inquiry average above (docs/funding.md).
LIMIT_GLOBAL = "330"
# AI calls an admitted inquiry may use (one inquiry typically needs 15–30), and how many days it stays open.
CALLS_PER_INQUIRY = "60"
INQUIRY_TTL_DAYS = "3"
# The owner's money, which is what is actually capped. Every call first reserves its worst case
# (UTF-8 bytes of system + user + schema as input tokens, MAX_TOKENS_CAP-bounded output) at the prices
# below, then settles to the usage the provider reports. No call is sent once today's spend plus its
# reservation would pass DAILY_BUDGET_USD, so the day cannot cost more than that however the calls are used.
# New inquiries stop at ADMIT_BUDGET_USD, leaving the rest for inquiries already under way
# ($0.50 ≈ 55 inquiries at the $0.009 average), so a learner is rarely cut off mid-inquiry.
DAILY_BUDGET_USD = "3"
ADMIT_BUDGET_USD = "2.5"
# USD per 1M tokens for MODEL (OpenAI's list price, 2026-09). Must equal MODEL's row in src/lib/llm/candidates.ts,
# the table the #/bench page costs runs with; src/lib/llm/candidates.test.ts fails if they drift apart.
# Change these together with MODEL. If either is missing or 0, /generate answers 503 instead of spending blind.
PRICE_INPUT_PER_M = "0.2"
PRICE_OUTPUT_PER_M = "1.2"
# Hour offset for the daily reset (9 = midnight JST)
RESET_TZ_OFFSET_HOURS = "9"
# Hard caps on a single request
MAX_TOKENS_CAP = "4000"
MAX_USER_CHARS = "8000"
# Feedback form (/feedback): messages per IP and in total per day, and the longest message accepted
FEEDBACK_LIMIT_IP = "5"
FEEDBACK_LIMIT_GLOBAL = "50"
FEEDBACK_MAX_CHARS = "4000"

# Secrets (set with `wrangler secret put <NAME>` or via the GitHub Action):
# PROVIDER_API_KEY
# RESEND_API_KEY  — feedback mail via Resend; without it (or FEEDBACK_TO) /feedback answers 503
# FEEDBACK_TO     — where feedback goes; must be the address the Resend account was registered with

[durable_objects]
bindings = [{ name = "QUOTA", class_name = "QuotaCounter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]
