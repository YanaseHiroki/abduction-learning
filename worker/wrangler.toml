# Cloudflare Worker that holds the shared (owner-paid) API key and enforces daily limits.
# Deploy: `pnpm --filter abduction-learning-proxy deploy` (or the GitHub Action in .github/workflows/worker.yml).
name = "abduction-learning-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Which provider the shared key belongs to: anthropic | openai | gemini
PROVIDER = "openai"
# Cheap model for the free tier. Chosen from the 2026-09 benchmark (docs/model-bench-2026-09.md):
# gpt-5.6-luna was the cheapest run that passed every check (≈ $0.0026 per example set, $0.0003 per
# translation test, 0 grammar errors). Runner-up: gemini-3.1-flash-lite (faster, 4× the translation cost).
# Re-run the app's unlinked #/bench page before changing this.
MODEL = "gpt-5.6-luna"
# Comma-separated origins allowed to call this proxy (the GitHub Pages site). Empty = allow any.
ALLOWED_ORIGINS = "https://yanasehiroki.github.io"
# The free tier is counted in inquiries. These are how many inquiries may be started per day.
# A device may start 5 on its first day (to try the method a few times), then 3 per day —
# enough to keep going with a second word pair, or to retry after a run that went nowhere.
LIMIT_DEVICE = "3"
LIMIT_DEVICE_FIRST_DAY = "5"
# Per IP: slows down clearing the anonymous device ID to get another first day. Must be >= the first-day limit.
LIMIT_IP = "10"
# Everyone together: caps the owner's daily spend at LIMIT_GLOBAL × CALLS_PER_INQUIRY calls (2,000 × 60 = 120,000).
# At the 2026-09 benchmark price for gpt-5.6-luna (docs/model-bench-2026-09.md: $0.0026 per example set,
# $0.0003 per translation test) that is at most $312/day — and only if all 2,000 inquiries burn every one of
# their 60 calls on the expensive endpoint. A realistic saturated day (15–30 calls each) costs $32–64.
# LIMIT_IP still applies, so reaching 2,000 inquiries takes at least 200 distinct IPs.
LIMIT_GLOBAL = "2000"
# AI calls an admitted inquiry may use (one inquiry typically needs 15–30), and how many days it stays open.
CALLS_PER_INQUIRY = "60"
INQUIRY_TTL_DAYS = "3"
# Hour offset for the daily reset (9 = midnight JST)
RESET_TZ_OFFSET_HOURS = "9"
# Hard caps on a single request
MAX_TOKENS_CAP = "4000"
MAX_USER_CHARS = "8000"
# Feedback form (/feedback): messages per IP and in total per day, and the longest message accepted
FEEDBACK_LIMIT_IP = "5"
FEEDBACK_LIMIT_GLOBAL = "50"
FEEDBACK_MAX_CHARS = "4000"

# Secrets (set with `wrangler secret put <NAME>` or via the GitHub Action):
# PROVIDER_API_KEY
# RESEND_API_KEY  — feedback mail via Resend; without it (or FEEDBACK_TO) /feedback answers 503
# FEEDBACK_TO     — where feedback goes; must be the address the Resend account was registered with

[durable_objects]
bindings = [{ name = "QUOTA", class_name = "QuotaCounter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]
