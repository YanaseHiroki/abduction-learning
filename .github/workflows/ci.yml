name: CI

# Until now only the deploy ran in CI, so a PR could go in with a type error or a failing test and
# nothing said so. The steps are split rather than one `pnpm test` so a failure names itself.
#
# Pushes to main do not trigger this directly: deploy.yml calls it and deploys only once it passes, so a
# change that fails here never reaches production.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Only superseded PR pushes are cancelled. When called from deploy.yml, github.workflow is the caller's
# name, and each main commit keeps its own run (see deploy.yml for why).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Types and build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit
      # The screen tests drive a real browser; the runner has no Google Chrome to fall back on.
      - name: Install the browser for the screen tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Screen tests
        run: pnpm test:ui
      # Changing the wording on a screen without re-shooting leaves the help showing copy the app no
      # longer uses, which is easy to miss in review because the pictures look fine on their own. This
      # lives in the required "ci" job (not a path-filtered workflow) so auto-merge waits for it too.
      - name: Help screenshots match the screens
        run: pnpm shots:check
      - name: Worker tests
        run: pnpm test:worker
