name: Deploy shared-key proxy (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/lib/llm/providers.ts"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped until the owner adds the Cloudflare secrets (see README).
    if: ${{ vars.PROXY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: pnpm
          command: deploy
          secrets: |
            PROVIDER_API_KEY
          vars: |
            PROVIDER
            MODEL
        env:
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          PROVIDER: ${{ vars.PROVIDER || 'openai' }}
          MODEL: ${{ vars.MODEL || 'gpt-5.6-luna' }}
